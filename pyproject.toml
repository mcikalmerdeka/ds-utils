[project]
name = "data-science-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "category-encoders>=2.6",
    "ipykernel",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "scipy>=1.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "tqdm>=4.66",
    "xgboost>=2.0",
]

[project.optional-dependencies]
text = [
    "beautifulsoup4>=4.12",
    "contractions>=0.1",
    "nltk>=3.9",
    "Pillow>=10",
    "textblob>=0.18",
    "wordcloud>=1.9",
]
translate = [
    "deep-translator>=1.11",
    "langid>=1.1.6",
    "tenacity>=8.2",
]
all = [
    "data-science-utils[text]",
    "data-science-utils[translate]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
