[project]
name = "data-science-utils"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "category-encoders",
    "ipykernel",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "tqdm",
    "xgboost",
]

[project.optional-dependencies]
text = [
    "beautifulsoup4",
    "contractions",
    "nltk",
    "Pillow",
    "textblob",
    "wordcloud",
]
translate = [
    "deep-translator",
    "langid",
    "tenacity",
]
all = [
    "data-science-utils[text]",
    "data-science-utils[translate]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
